name: On-Demand Audit

on:
  workflow_dispatch:
    inputs:
      enable_s3_lifecycle:
        description: "S3 lifecycle/versioning 점검 (느림)"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gh-actions-ondemand-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - name: Run audit
        env:
          S3_REPORT_BUCKET: ${{ secrets.S3_REPORT_BUCKET }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENABLE_S3_LIFECYCLE: ${{ inputs.enable_s3_lifecycle }}
        run: python scripts/audit.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-audit-ondemand-${{ github.run_id }}
          path: audit-output/
          retention-days: 7
